name: Daily connection check

# Runs one read-only Composio tool per tested guide and commits the result to
# data/smoke-status.json, which the site shows as "Connection checked <date>".
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checks
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: python scripts/smoke_test.py
      - name: Commit status
        run: |
          git config user.name "oauth-ready-bot"
          git config user.email "oauth-ready-bot@users.noreply.github.com"
          git add data/smoke-status.json
          git diff --cached --quiet || git commit -m "Daily connection check $(date -u +%Y-%m-%d)"
          git push
